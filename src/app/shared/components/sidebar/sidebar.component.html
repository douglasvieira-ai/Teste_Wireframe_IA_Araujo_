<aside class="sidebar">
  <!-- Header -->
  <header class="sidebar__header">
    <img src="assets/logo-araujo.svg" alt="IA Araujo" class="logo-mark" />
    <span class="logo">IA Araujo</span>
    <button
      class="collapse-btn"
      [title]="layout.sidebarCollapsed() ? 'Fixar menu' : 'Recolher menu'"
      (click)="layout.toggleSidebar()"
    >
      <app-icon [name]="layout.sidebarCollapsed() ? 'panel-left' : 'panel-left-close'" [size]="18" />
    </button>
  </header>
  
  <div class="sidebar__divider"></div>
  
  <!-- Search -->
  <div class="sidebar__search">
    <div class="search-input">
      <app-icon name="search" [size]="16" class="search-icon" />
      <input type="text" placeholder="Buscar..." class="search-field">
    </div>
  </div>
  
  <!-- Navigation -->
  <nav class="sidebar__nav">
    <span class="section-title">NAVEGAÇÃO</span>
    @for (item of navItems; track item.label) {
      <a 
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/home' }"
        [title]="item.label"
        (click)="onNavClick(item)"
      >
        <app-icon [name]="item.icon" [size]="18" class="nav-icon" />
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>
  
  <div class="sidebar__divider sidebar__divider--inset"></div>
  
  <!-- Favorites -->
  <section class="sidebar__section">
    <span class="section-title">
      <app-icon name="star" [size]="12" />
      FAVORITOS
    </span>
    @for (fav of favorites; track fav.id) {
      <a class="fav-item" [routerLink]="['/chat', fav.id]" [title]="fav.name">
        <span class="fav-dot" [style.background-color]="fav.color"></span>
        <span class="fav-name">{{ fav.name }}</span>
      </a>
    }
  </section>
  
  <div class="sidebar__divider sidebar__divider--inset"></div>
  
  <!-- Recent Conversations -->
  <section class="sidebar__section sidebar__section--grow">
    <span class="section-title">
      <app-icon name="message-circle" [size]="12" />
      RECENTES
    </span>
    @for (conv of conversations; track conv.id) {
      <a class="recent-item" [routerLink]="['/chat', conv.agentId]" [title]="conv.title">
        <span class="recent-rail-dot"></span>
        <div class="recent-body">
          <div class="recent-header">
            <span class="recent-title">{{ conv.title }}</span>
            <span class="recent-time">{{ formatTime(conv.timestamp) }}</span>
          </div>
          <span class="recent-preview">{{ conv.preview }}</span>
        </div>
      </a>
    }
  </section>
  
  <div class="sidebar__divider sidebar__divider--inset"></div>
  
  <!-- Footer -->
  <footer class="sidebar__footer">
    <button class="footer-btn" title="Configurações">
      <app-icon name="settings" [size]="18" />
    </button>
    <button class="footer-btn" title="Tema">
      <app-icon name="moon" [size]="18" />
    </button>
    <button class="footer-btn" title="Ajuda">
      <app-icon name="help-circle" [size]="18" />
    </button>
    <button class="footer-btn" title="Sair">
      <app-icon name="log-out" [size]="18" />
    </button>
  </footer>
</aside>
